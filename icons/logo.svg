<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#glow)"/>

  <!-- Answer bubble -->
  <path filter="url(#shadow)" fill="#ffffff"
        d="M40 30 H86 A20 20 0 0 1 106 50 V72 A20 20 0 0 1 86 92 H60 L40 107 V92 A20 20 0 0 1 22 72 V50 A20 20 0 0 1 40 30 Z"/>

  <!-- Check mark -->
  <path d="M46 61 L58 73 L83 48" fill="none" stroke="url(#tick)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI sparkles -->
  <path fill="#FDE047"
        d="M104 10 C105.6 21 108 23.4 119 25 C108 26.6 105.6 29 104 40 C102.4 29 100 26.6 89 25 C100 23.4 102.4 21 104 10 Z"/>
  <path fill="#FEF9C3"
        d="M86 8 C86.7 12.3 87.7 13.3 92 14 C87.7 14.7 86.7 15.7 86 20 C85.3 15.7 84.3 14.7 80 14 C84.3 13.3 85.3 12.3 86 8 Z"/>
</svg>
